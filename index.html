  return (
    <div className="flex items-center justify-between mb-2">
      <span className="text-xs font-semibold" style={{ color: COLORS.ink }}>{label}</span>
      <div className="flex items-center gap-2">
        <button onClick={() => onChange(clamp(value - 1, min, max))} className="rounded-full" style={{ background: COLORS.paper, width: 24, height: 24 }}>−</button>
        <span className="text-sm font-bold w-5 text-center tabular-nums" style={{ fontFamily: FONT_HEAD, color: COLORS.ink }}>{value}</span>
        <button onClick={() => onChange(clamp(value + 1, min, max))} className="rounded-full" style={{ background: COLORS.amberBg, color: COLORS.amber, width: 24, height: 24 }}>+</button>
      </div>
    </div>
  );
}

// One real 3D unit cube: 6 independently-transformed faces so it can be
// viewed, and rotated, from any angle — not a fixed isometric drawing.
const Cube3D = React.memo(function Cube3D({ s, x, y, z, paint, count, selected, dataKey }) {
  const half = s / 2;
  const color = COUNT_COLORS[count] || CUT;
  const faces = [
    { key: "north", painted: paint.north, transform: `translateZ(${half}px)` },
    { key: "south", painted: paint.south, transform: `rotateY(180deg) translateZ(${half}px)` },
    { key: "east", painted: paint.east, transform: `rotateY(90deg) translateZ(${half}px)` },
    { key: "west", painted: paint.west, transform: `rotateY(-90deg) translateZ(${half}px)` },
    { key: "top", painted: paint.top, transform: `rotateX(90deg) translateZ(${half}px)` },
    { key: "bottom", painted: paint.bottom, transform: `rotateX(-90deg) translateZ(${half}px)` },
  ];
  return (
    <div
      data-cube-key={dataKey}
      style={{
        position: "absolute", left: 0, top: 0, width: s, height: s,
        transformStyle: "preserve-3d",
        transform: `translate3d(${x}px, ${y}px, ${z}px)`,
        transition: "transform 0.9s cubic-bezier(.3,.1,.2,1)",
      }}
    >
      {faces.map((f) => (
        <div
          key={f.key}
          data-cube-key={dataKey}
          style={{
            position: "absolute", inset: 0,
            background: f.painted ? color : CUT,
            border: `1.5px solid ${selected ? "#D9862A" : "#1C2531"}`,
            boxShadow: selected ? "0 0 0 3px rgba(217,134,42,0.65) inset" : "none",
            transform: f.transform,
            backfaceVisibility: "hidden",
            WebkitBackfaceVisibility: "hidden",
          }}
        />
      ))}
    </div>
  );
});

function CubeLab() {
  const [L, setL] = useState(4);
  const [B, setB] = useState(3);
  const [H, setH] = useState(3);
  const [exploded, setExploded] = useState(false);
  const [hideValues, setHideValues] = useState(false);
  const [selected, setSelected] = useState(null);
  const [viewX, setViewX] = useState(-22);
  const [viewY, setViewY] = useState(-34);
  const [autoSpin, setAutoSpin] = useState(false);
  const dragRef = useRef(null);
  const rafRef = useRef(null);
  const pendingRef = useRef(null);
  const sceneRef = useRef(null);

  useEffect(() => {
    if (!autoSpin) return;
    let raf;
    let angle = viewY;
    const tick = () => {
      angle += 0.5;
      if (sceneRef.current) {
        sceneRef.current.style.transform = `rotateX(${viewX}deg) rotateY(${angle}deg)`;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => {
      cancelAnimationFrame(raf);
      setViewY(angle); // hand the final angle back to React state once spinning stops
    };
  }, [autoSpin]);

  const onPointerMove = (e) => {
    if (!dragRef.current) return;
    const dx = e.clientX - dragRef.current.x;
    const dy = e.clientY - dragRef.current.y;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) dragRef.current.moved = true;
    pendingRef.current = { dx, dy };
    if (rafRef.current == null) {
      rafRef.current = requestAnimationFrame(() => {
        rafRef.current = null;
        const p = pendingRef.current;
        const drag = dragRef.current;
        if (p && drag) {
          const newY = drag.vy + p.dx * 0.5;
          const newX = clamp(drag.vx - p.dy * 0.5, -85, 85);
          drag.curX = newX;
          drag.curY = newY;
          if (sceneRef.current) {
            sceneRef.current.style.transform = `rotateX(${newX}deg) rotateY(${newY}deg)`;
          }
        }
      });
    }
  };
  const onPointerUp = (e) => {
    const drag = dragRef.current;
    if (drag && !drag.moved) {
      const el = e.target.closest && e.target.closest("[data-cube-key]");
      if (el) {
        const [kx, ky, kz] = el.dataset.cubeKey.split("-").map(Number);
        setSelected((prev) =>
          prev && prev.x === kx && prev.y === ky && prev.z === kz ? null : cubes.find((c) => c.x === kx && c.y === ky && c.z === kz) || null
        );
      }
    }
    // Only touch React state once, at the very end of the gesture — during
    // the drag itself we mutated the DOM directly (see onPointerMove) so
    // React never had to reconcile the ~1000 cube elements per frame.
    if (drag && drag.curX !== undefined) {
      setViewX(drag.curX);
      setViewY(drag.curY);
    }
    dragRef.current = null;
    if (rafRef.current != null) {
      cancelAnimationFrame(rafRef.current);
      rafRef.current = null;
    }
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", onPointerUp);
  };
  const onPointerDown = (e) => {
    dragRef.current = { x: e.clientX, y: e.clientY, vx: viewX, vy: viewY, moved: false };
    setAutoSpin(false);
    if (sceneRef.current) sceneRef.current.style.transition = "none";
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
  };

  const cubes = useMemo(() => {
    const arr = [];
    for (let x = 0; x < L; x++)
      for (let y = 0; y < B; y++)
        for (let z = 0; z < H; z++) {
          const paint = { north: y === B - 1, south: y === 0, east: x === L - 1, west: x === 0, top: z === H - 1, bottom: z === 0 };
          const count = Object.values(paint).filter(Boolean).length;
          arr.push({ x, y, z, count, paint });
        }
    return arr;
  }, [L, B, H]);

  const { groups, groupKeys } = useMemo(() => {
    const g = {};
    cubes.forEach((c) => (g[c.count] = (g[c.count] || 0) + 1));
    return { groups: g, groupKeys: Object.keys(g).map(Number).sort((a, b) => b - a) };
  }, [cubes]);

  const s = clamp(170 / Math.max(L, B, H, 3), 13, 40);
  const explodeDist = s * 1.4; // how far the shell peels away from the core
  const cx = (L - 1) / 2, cy = (B - 1) / 2, cz = (H - 1) / 2;

  return (
    <div className="w-full min-h-screen" style={{ background: COLORS.paper, fontFamily: "ui-sans-serif, system-ui, sans-serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap');`}</style>
      <div
        className="max-w-4xl mx-auto px-6 py-8"
        style={{ backgroundImage: `linear-gradient(${COLORS.grid} 1px, transparent 1px), linear-gradient(90deg, ${COLORS.grid} 1px, transparent 1px)`, backgroundSize: "26px 26px" }}
      >
        <div className="flex items-center gap-2 mb-1.5">
          <div className="flex items-center justify-center rounded-lg" style={{ width: 34, height: 34, background: COLORS.ink }}>
            <Box size={18} color={COLORS.amberBg} />
          </div>
          <div>
            <div className="text-[10px] font-bold uppercase tracking-widest" style={{ color: COLORS.amber }}>Geometry · Painted Cube</div>
            <h1 className="text-2xl leading-tight font-bold" style={{ color: COLORS.ink, fontFamily: FONT_HEAD }}>Cube Lab</h1>
          </div>
        </div>
        <p className="text-sm mb-6 ml-[44px]" style={{ color: COLORS.inkSoft }}>
          Build a painted cuboid out of unit cubes, spin it around, then break it apart to see how many faces each little cube really has painted.
        </p>

        <div className="grid grid-cols-1 lg:grid-cols-[220px_1fr] gap-5">
          <div className="flex flex-col gap-4">
            <div className="rounded-2xl p-4" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, boxShadow: CARD_SHADOW }}>
              <Eyebrow>Dimensions (units)</Eyebrow>
              <Stepper label="Length" value={L} onChange={setL} max={10} />
              <Stepper label="Breadth" value={B} onChange={setB} max={10} />
              <Stepper label="Height" value={H} onChange={setH} max={10} />
              <div className="text-[11px] mt-2 font-mono" style={{ color: COLORS.inkSoft }}>{L} × {B} × {H} = {L * B * H} cubes</div>
            </div>

            <button
              onClick={() => { setExploded((e) => !e); setSelected(null); }}
              className="flex items-center justify-center gap-2 rounded-full py-2.5 text-sm font-semibold transition-colors"
              style={{ background: exploded ? COLORS.amberBg : COLORS.ink, color: exploded ? COLORS.amber : "#fff", boxShadow: CARD_SHADOW }}
            >
              <Hammer size={15} /> {exploded ? "Put it back together" : "Break it apart"}
            </button>

            <button
              onClick={() => setAutoSpin((a) => !a)}
              className="flex items-center justify-center gap-1.5 text-xs font-semibold rounded-full px-3 py-2"
              style={{ background: autoSpin ? COLORS.amberBg : COLORS.card, color: autoSpin ? COLORS.amber : COLORS.inkSoft, border: `1px solid ${COLORS.border}` }}
            >
              <Shuffle size={13} /> {autoSpin ? "Stop spin" : "Auto-spin"}
            </button>

            {exploded && (
              <button
                onClick={() => setHideValues((v) => !v)}
                className="flex items-center justify-center gap-1.5 text-xs font-semibold rounded-full px-3 py-2"
                style={{ background: hideValues ? COLORS.amberBg : COLORS.card, color: hideValues ? COLORS.amber : COLORS.inkSoft, border: `1px solid ${COLORS.border}` }}
              >
                {hideValues ? <Eye size={13} /> : <EyeOff size={13} />}
                {hideValues ? "Reveal counts" : "Hide counts"}
              </button>
            )}

            <button onClick={() => { setL(4); setB(3); setH(3); setExploded(false); setSelected(null); }} className="flex items-center justify-center gap-1.5 text-xs font-medium rounded-full py-2 opacity-70 hover:opacity-100" style={{ color: COLORS.inkSoft }}>
              <RotateCcw size={12} /> Reset
            </button>
          </div>

          <div className="flex flex-col gap-4">
            <div className="rounded-2xl p-4" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, boxShadow: CARD_SHADOW }}>
              <div
                onPointerDown={onPointerDown}
                style={{ perspective: 1000, height: 380, display: "flex", alignItems: "center", justifyContent: "center", cursor: "grab", touchAction: "none" }}
              >
                <div
                  ref={sceneRef}
                  style={{
                    position: "relative", width: 1, height: 1, transformStyle: "preserve-3d",
                    transform: `rotateX(${viewX}deg) rotateY(${viewY}deg)`,
                    transition: dragRef.current || autoSpin ? "none" : "transform 0.15s linear",
                    willChange: "transform",
                  }}
                >
                  {cubes
                    .filter((c) => exploded || c.count > 0)
                    .map((c) => {
                    const isSel = selected && selected.x === c.x && selected.y === c.y && selected.z === c.z;
                    return (
                      <Cube3D
                        key={`${c.x}-${c.y}-${c.z}`}
                        dataKey={`${c.x}-${c.y}-${c.z}`}
                        s={s}
                        x={(c.x - cx) * s - s / 2 + (exploded ? ((c.paint.west ? -1 : 0) + (c.paint.east ? 1 : 0)) * explodeDist : 0)}
                        y={-(c.z - cz) * s - s / 2 - (exploded ? ((c.paint.bottom ? -1 : 0) + (c.paint.top ? 1 : 0)) * explodeDist : 0)}
                        z={(c.y - cy) * s + (exploded ? ((c.paint.south ? -1 : 0) + (c.paint.north ? 1 : 0)) * explodeDist : 0)}
                        paint={c.paint}
                        count={c.count}
                        selected={isSel}
                      />
                    );
                  })}
                </div>
              </div>
              <div className="text-center text-[11px] mt-1" style={{ color: COLORS.inkSoft }}>Drag to rotate</div>
            </div>

            {exploded && selected && (
              <div className="rounded-2xl p-3 text-center" style={{ background: COLORS.amberBg }}>
                <span className="text-sm font-bold" style={{ color: COLORS.amber, fontFamily: FONT_HEAD }}>
                  This cube has {selected.count} face{selected.count === 1 ? "" : "s"} painted
                </span>
              </div>
            )}

            {exploded && !hideValues && (
              <div className="rounded-2xl p-4" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, boxShadow: CARD_SHADOW }}>
                <Eyebrow>How many of each</Eyebrow>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                  {groupKeys.map((k) => (
                    <div key={k} className="rounded-xl py-2 text-center" style={{ background: COLORS.paper }}>
                      <div className="text-lg font-bold tabular-nums" style={{ color: COLORS.ink, fontFamily: FONT_HEAD }}>{groups[k]}</div>
                      <div className="text-[10px]" style={{ color: COLORS.inkSoft }}>{k} face{k === 1 ? "" : "s"} painted</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

return CubeLab;
})();

// ---------------------------------------------------------------------
// Hub shell: home screen + hash-based navigation between tools
// ---------------------------------------------------------------------
const SHELL = {
  paper: "#F3F0E7", card: "#FFFFFF", border: "#E2DED0", ink: "#1C2531",
  inkSoft: "#6E7885", amber: "#D9862A", amberBg: "#FBEAD3",
};
const SHELL_FONT = "'Space Grotesk', ui-sans-serif, system-ui, sans-serif";

const TOOLS = [
  { id: "volume", title: "Volume Lab", desc: "Water height, connected tanks, and draining through a hole.", emoji: "🧪", accent: "#D9862A", Component: VolumeLab },
  { id: "nets", title: "Nets Lab", desc: "Build a cube net square by square and watch it fold in 3D.", emoji: "📦", accent: "#7C5CBF", Component: NetsLab },
  { id: "money", title: "Money Box", desc: "Singapore coins and notes, drawn to scale, add up to any amount.", emoji: "💰", accent: "#3E8F62", Component: MoneyLab },
  { id: "fractions", title: "Fraction Toy", desc: "Bars, circles, and a drag-and-drop workspace to compare sizes.", emoji: "🥧", accent: "#3E8EDE", Component: FractionLab },
  { id: "clock", title: "Clock", desc: "Drag the hands to set any time, with a day/night background.", emoji: "🕐", accent: "#D9862A", Component: ClockLab },
  { id: "cube", title: "Cube Lab", desc: "Build a painted cuboid, spin it in 3D, then break it apart.", emoji: "📦", accent: "#5B9E52", Component: CubeLab },
];

function HomeScreen({ go }) {
  return (
    <div className="w-full min-h-screen" style={{ background: SHELL.paper, fontFamily: "ui-sans-serif, system-ui, sans-serif" }}>
      <div className="max-w-3xl mx-auto px-6 py-10">
        <div className="text-[11px] font-bold uppercase tracking-widest mb-1" style={{ color: SHELL.amber }}>Primary Math</div>
        <h1 className="text-3xl font-bold mb-2" style={{ color: SHELL.ink, fontFamily: SHELL_FONT }}>Toolkit</h1>
        <p className="text-sm mb-8" style={{ color: SHELL.inkSoft }}>Pick a tool to open it.</p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          {TOOLS.map((t) => (
            <button
              key={t.id}
              onClick={() => go(t.id)}
              className="text-left rounded-2xl p-5 transition-transform active:scale-[0.98]"
              style={{ background: SHELL.card, border: `1px solid ${SHELL.border}`, boxShadow: "0 1px 2px rgba(28,37,49,0.04), 0 10px 28px -14px rgba(28,37,49,0.22)" }}
            >
              <div className="flex items-center justify-center rounded-xl mb-3" style={{ width: 44, height: 44, background: t.accent + "22", fontSize: 22 }}>
                {t.emoji}
              </div>
              <div className="text-base font-bold mb-1" style={{ color: SHELL.ink, fontFamily: SHELL_FONT }}>{t.title}</div>
              <div className="text-xs" style={{ color: SHELL.inkSoft }}>{t.desc}</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState(() => (window.location.hash || "#home").slice(1));

  useEffect(() => {
    const onHash = () => setView((window.location.hash || "#home").slice(1));
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const go = (id) => {
    window.location.hash = id;
    setView(id);
  };

  const tool = TOOLS.find((t) => t.id === view);

  if (!tool) return <HomeScreen go={go} />;

  const ToolComponent = tool.Component;
  return (
    <div>
      <div className="sticky top-0 z-50 flex items-center gap-3 px-4 py-2.5" style={{ background: SHELL.ink }}>
        <button onClick={() => go("home")} className="flex items-center gap-1.5 text-sm font-semibold text-white active:opacity-70">
          <span style={{ fontSize: 16 }}>←</span> Home
        </button>
        <span className="text-xs" style={{ color: "rgba(255,255,255,0.55)" }}>{tool.emoji} {tool.title}</span>
      </div>
      <ToolComponent />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
